services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-7066}:3000'
    environment:
      DATABASE_URL: postgres://digifriends:${POSTGRES_PASSWORD}@db:5432/digifriends
      ORIGIN: ${ORIGIN}
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      SECRET_PEPPER: ${SECRET_PEPPER}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      INACTIVE_AFTER_DAYS: ${INACTIVE_AFTER_DAYS:-365}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      MAX_PHOTOS_PER_ENTRY: ${MAX_PHOTOS_PER_ENTRY:-6}
      MAX_DRAWINGS_PER_ENTRY: ${MAX_DRAWINGS_PER_ENTRY:-4}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-12000000}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Genau ein Reverse-Proxy-Hop davor (siehe .env.example): adapter-node
      # liest die echte Besucher-IP aus X-Forwarded-For statt der Proxy-IP,
      # damit IP-basiertes Rate-Limiting funktioniert.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digifriends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: digifriends
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digifriends -d digifriends']
      interval: 5s
      timeout: 5s
      retries: 20

  # Taegliche Sicherung von Datenbank + Uploads, nach BACKUP_KEEP_DAYS
  # automatisch aufgeraeumt. Landet in ./backups (Bind-Mount statt Volume,
  # damit man die Dateien direkt sieht und z. B. per rsync extern abholen
  # kann). Kein eigenes Image noetig: postgres:16-alpine bringt pg_dump und
  # tar schon mit (gleiches Image wie der db-Service, kein Extra-Download).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: digifriends
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: digifriends
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:

networks:
  default:
    # Host betreibt schon viele Compose-Stacks; die Docker-Standard-Adresspools
    # (172.16-31.0.0/16, 192.168.0-240.0/20) sind belegt. Eigenes, isoliertes
    # Subnetz statt Docker das naechste freie raten zu lassen.
    ipam:
      config:
        - subnet: 10.89.0.0/24
