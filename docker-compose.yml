services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-7066}:3000'
    environment:
      DATABASE_URL: postgres://digifriends:${POSTGRES_PASSWORD}@db:5432/digifriends
      ORIGIN: ${ORIGIN}
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      SECRET_PEPPER: ${SECRET_PEPPER}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      MAX_PHOTOS_PER_ENTRY: ${MAX_PHOTOS_PER_ENTRY:-6}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-12000000}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digifriends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: digifriends
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digifriends -d digifriends']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  uploads:
